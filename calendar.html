<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Wyken ARSC</title>
<meta name="description" content="Wyken ARSC events calendar — training, competitions, gradings, showcases and socials. Filter by type and add events to your own calendar.">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="calendar">
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">

    <h1>Events calendar</h1>
    <p>Training, competitions, gradings, showcases and socials — filter by type and add any event straight to your own calendar.</p>

    <div class="cal-filters" id="cal-filters"></div>
    <div id="event-list"></div>

  </div>
</section>

<div id="site-footer"></div>
<script src="app.js"></script>
