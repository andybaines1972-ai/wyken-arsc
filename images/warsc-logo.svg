  <!-- skater silhouette (arabesque) standing on the ribbon -->
  <g stroke="#8c8c8c" stroke-width="4.2" stroke-linecap="round" fill="none">
    <line x1="50" y1="95" x2="53" y2="66"/>
    <line x1="53" y1="66" x2="57" y2="48"/>
    <line x1="56" y1="54" x2="80" y2="56"/>
    <line x1="53" y1="66" x2="30" y2="55"/>
  </g>
  <circle cx="58" cy="42" r="5.2" fill="#8c8c8c"/>
  <path d="M47 64 L68 64 L57 50 Z" fill="#e6197d"/>
  <!-- wordmark (fixed width so it never clips) -->
  <text x="114" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="#e6197d" textLength="196" lengthAdjust="spacingAndGlyphs">WARSC</text>
  <!-- script subtitle (fixed width so it never clips) -->
  <text x="116" y="120" font-family="'Segoe Script','Brush Script MT','Comic Sans MS',cursive" font-style="italic" font-size="16" fill="#9a9a9a" textLength="196" lengthAdjust="spacingAndGlyphs">Wyken Artistic Roller Skating Club</text>
</svg>
